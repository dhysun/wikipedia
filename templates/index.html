<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='Wikipedia_Favicon.png') }}">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  </head>

  <body>

    <nav class="navbar py-3">
      <div class="container-fluid d-flex align-items-start flex-nowrap px-4">
        <div class="flex-fill"></div>

        <a class="navbar-brand mx-auto p-0" href="#">
          <img src="{{ url_for('static', filename='site-logo.png') }}"
               alt="Wikipedia Pathfinder Logo"
               class="logo img-fluid">
        </a>

        <div class="flex-fill d-flex justify-content-end align-items-center gap-4 pt-1">
          <a href="#" class="link fs-5" id="aboutLink" data-bs-toggle="modal" data-bs-target="#aboutModal">About</a>
          <a href="#" class="link fs-5" target="_blank" rel="noopener">GitHub</a>
        </div>
      </div>
    </nav>

    <div class="container mt-5">
      <div class="row justify-content-center mb-4">
        <div class="col-lg-8">
          <div class="card">
            <div class="card-body article-container">

              <div class="article-row d-flex justify-content-center align-items-center gap-3 p-3">

                <div class="input-group position-relative article-input-group">
                  <input
                      type="text"
                      class="form-control"
                      id="startArticle"
                      name="startArticle"
                      autocomplete="off"
                      placeholder="Start Article">

                  <button type="button" class="btn btn-outline-secondary" onclick="getRandomStart()">
                    <i class="bi bi-shuffle fs-5"></i>
                  </button>

                  <div id="startSuggestions"
                       class="list-group position-absolute"
                       style="z-index:1000; top:100%; left:0;">
                  </div>
                </div>

                <button type="button" class="btn btn-link swap p-0 border-0 text-dark" onclick="swap()">
                  <i class="bi bi-arrow-left-right"></i>
                </button>

                <div class="input-group position-relative article-input-group">
                  <input
                      type="text"
                      class="form-control"
                      id="endArticle"
                      name="endArticle"
                      autocomplete="off"
                      placeholder="End Article">

                  <button type="button" class="btn btn-outline-secondary" onclick="getRandomEnd()">
                    <i class="bi bi-shuffle fs-5"></i>
                  </button>

                  <div id="endSuggestions"
                       class="list-group position-absolute"
                       style="z-index:1000; top:100%; left:0;">
                  </div>
                </div>

              </div>

              <div class="d-flex justify-content-center p-3">
                <button type="button" class="btn btn-primary px-5 py-2 fw-bold" onclick="findPath()">
                  Search
                </button>
              </div>

            </div>
          </div>
        </div>
      </div>

      <div class="row justify-content-center">
        <div class="col-lg-8">
          <div class="card">
            <div class="card-body">
              <h4 class="card-title mb-3">Results</h4>
              <div id="results">
                Output will appear here.
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="modal fade" id="aboutModal" tabindex="-1" aria-labelledby="aboutModalLabel" aria-hidden="true">
      <div class="modal-dialog mt-5" style="max-width:450px;">
        <div class="modal-content" style="max-height:80vh; overflow-y:auto;">
          <div class="modal-header">
            <h5 class="modal-title" id="aboutModalLabel">About</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <p>placeholder</p>
          </div>
        </div>
      </div>
    </div>

    <script>
        function swap() {
            const start = document.getElementById("startArticle");
            const end = document.getElementById("endArticle");

            [start.value, end.value] = [end.value, start.value];
        }

        async function findPath() {
            const start = document.getElementById("startArticle").value;
            const end = document.getElementById("endArticle").value;

            const response = await fetch("/search", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    start: start,
                    end: end
                })
            });

            const data = await response.json();

            const results = document.getElementById("results");
            results.innerHTML = "";

            if (data.path) {
                let row;

                data.path.forEach(function (path, index) {
                    const heading = document.createElement("h6");
                    heading.className = "mb-2";
                    heading.textContent = `Path ${index + 1}`;  

                    if (index % 2 === 0) {
                        row = document.createElement("div");
                        row.className = "row";
                        results.appendChild(row);
                    }

                    const col = document.createElement("div");
                    col.className = "col-md-6 mb-3";

                    const list = document.createElement("div");
                    list.className = "list-group";

                    path.forEach(function (title) {
                        const item = document.createElement("a");
                        item.className = "list-group-item list-group-item-action";
                        item.href = "https://en.wikipedia.org/wiki/" +
                            encodeURIComponent(title.replace(/ /g, "_"));
                        item.target = "_blank";
                        item.rel = "noopener";
                        item.textContent = title;
                        list.appendChild(item);
                    });
                    
                    col.appendChild(heading);
                    col.appendChild(list);
                    row.appendChild(col);
                });
            } else {
                const notFound = document.createElement("p");
                notFound.textContent = "No path found.";
                results.appendChild(notFound);
            }

            const timeLine = document.createElement("p");
            timeLine.className = "text-muted mb-0";
            timeLine.textContent = "Time taken: " + data.time_str;
            results.appendChild(timeLine);
        }

        function setupAutocomplete(inputId, suggestionId) {

            const input = document.getElementById(inputId);
            const suggestions = document.getElementById(suggestionId);

            input.addEventListener("input", function () {

                const text = input.value.trim();

                suggestions.style.width = input.offsetWidth + "px";

                if (text === "") {
                    suggestions.innerHTML = "";
                    suggestions.classList.remove("border", "rounded-bottom", "bg-white", "shadow-sm");
                    return;
                }

                fetch("/autocomplete?q=" + encodeURIComponent(text))
                    .then(response => response.json())
                    .then(results => {

                        suggestions.innerHTML = "";

                        if (results.length === 0) {
                            suggestions.classList.remove("border", "rounded-bottom", "bg-white", "shadow-sm");
                            return;
                        }

                        suggestions.classList.add("border", "rounded-bottom", "bg-white", "shadow-sm");

                        results.forEach(function(title) {

                            const item = document.createElement("button");

                            item.type = "button";
                            item.className = "list-group-item list-group-item-action";
                            item.textContent = title;

                            item.onclick = function() {
                                input.value = title;
                                suggestions.innerHTML = "";
                                suggestions.classList.remove("border", "rounded-bottom", "bg-white", "shadow-sm");
                            };

                            suggestions.appendChild(item);
                        });
                    });
            });

        }

        setupAutocomplete("startArticle", "startSuggestions");
        setupAutocomplete("endArticle", "endSuggestions");

        function getRandomStart() {
            fetch("/random")
                .then(response => response.json())
                .then(data => {
                    const randomTitle = data.title;
                    const startInput = document.getElementById("startArticle");

                    if (startInput.value.trim() === "") {
                        startInput.value = randomTitle;
                    } else {
                        startInput.value = randomTitle;
                    }
                });
        }

        function getRandomEnd() {
            fetch("/random")
                .then(response => response.json())
                .then(data => {
                    const randomTitle = data.title;
                    const endInput = document.getElementById("endArticle");

                    if (endInput.value.trim() === "") {
                        endInput.value = randomTitle;
                    } else {
                        endInput.value = randomTitle;
                    }
                });
        }

    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

  </body>
</html>
