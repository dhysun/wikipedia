<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Wikipedia Game</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  </head>
  <body>
    <div class="container mt-5">

    <h1 class="mb-4">Wikipedia Game</h1>

    <div class="row">

        <div class="col-md-5">
            <div class="card">
                <div class="card-body">

                    <h4 class="card-title mb-3">Search</h4>

                    <div>

                        <div class="mb-3">
                            <label for="startArticle" class="form-label">Start Article</label>
                            <input type="text"
                                   class="form-control"
                                   id="startArticle"
                                   name="startArticle"
                                   placeholder="e.g. Tung Tung Tung Sahur">
                        </div>

                        <div class="mb-3">
                            <label for="endArticle" class="form-label">End Article</label>
                            <input type="text"
                                   class="form-control"
                                   id="endArticle"
                                   name="endArticle"
                                   placeholder="e.g. Carnegie Mellon University">
                        </div>

                        <button type="button" class="btn btn-primary" onclick="findPath()">
                            Find Path
                        </button>
                        <script>
                            async function findPath(){
                                const start = document.getElementById("startArticle").value;
                                const end = document.getElementById("endArticle").value;

                                const path = await fetch("/search",{
                                    method: "POST",
                                    headers: {
                                        "Content-Type": "application/json"
                                    },

                                    body: JSON.stringify({
                                        start: start,
                                        end: end
                                    })
                                });
                                    
                                const data = await path.json()
                                document.getElementById("results").textContent = data.path;
                            }

                            function swap(){    
                                const start = document.getElementById("startArticle"); 
                                const end = document.getElementById("endArticle");

                                [start.value,end.value] = [end.value,start.value];
                            }

                        </script>

                    </div>

                </div>
            </div>
        </div>


        <div class="col-md-7">
            <div class="card">
                <div class="card-body">

                    <h4 class="card-title mb-3">Results</h4>

                    <div id="results">
                        Output will appear here.
                    </div>

                </div>
            </div>
        </div>

    </div>

    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </body>
</html>
